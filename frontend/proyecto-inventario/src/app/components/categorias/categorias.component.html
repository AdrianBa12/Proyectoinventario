<div class="categorias-container">
    <div class="header">
      <h1>Gestión de Categorías</h1>
      <button mat-raised-button color="primary" (click)="openFormDialog()">
        <mat-icon>add</mat-icon> Nueva Categoría
      </button>
    </div>
  
    <div class="table-container">
      <table mat-table [dataSource]="categorias" class="mat-elevation-z8">
        <!-- Nombre Column -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let categoria">{{ categoria.nombre }}</td>
        </ng-container>
  
        <!-- Descripción Column -->
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let categoria">{{ categoria.descripcion }}</td>
        </ng-container>
  
        <!-- Acciones Column -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let categoria">
            <button mat-icon-button color="primary" (click)="openFormDialog(categoria)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteCategoria(categoria._id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
