<div class="productos-container">
    <div class="header">
      <h1>Gestión de Productos</h1>
      <div>
        <button mat-raised-button color="primary" (click)="openFormDialog()">
          <mat-icon>add</mat-icon> Nuevo Producto
        </button>
        
        <button mat-raised-button color="accent" [routerLink]="['/dashboard']">
          <mat-icon>dashboard</mat-icon> Volver a Dashboard
        </button>
      </div>
    </div>
  
    <div class="table-container">
      <table mat-table [dataSource]="productos" class="mat-elevation-z8">
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let producto">{{ producto.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef>Descripción</th>
            <td mat-cell *matCellDef="let producto">{{ producto.descripcion }}</td>
          </ng-container>
  
        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef>Precio (S/)</th>
          <td mat-cell *matCellDef="let producto">{{ producto.precio | number:'1.2-2' }}</td>
        </ng-container>
  
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let producto">{{ producto.stock }}</td>
        </ng-container>
  
        <ng-container matColumnDef="categoria">
          <th mat-header-cell *matHeaderCellDef>Categoría</th>
          <td mat-cell *matCellDef="let producto">{{ getCategoriaNombre(producto.categoria) }}</td>
        </ng-container>
  
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let producto">
            <button mat-icon-button color="primary" (click)="openFormDialog(producto)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteProducto(producto._id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
