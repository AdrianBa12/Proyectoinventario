<div class="login-wrapper">
  <div class="login-background">
    <div class="gradient-overlay"></div>
  </div>
  
  <mat-card class="login-card mat-elevation-z10">
    <div class="logo-container">
      <img src="logo.png" alt="Logo" class="logo">  
      <h1 class="app-name">Gestion de Inventario</h1>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Usuario -->
      <mat-form-field appearance="fill" floatLabel="always" class="form-field">
        <mat-label>Usuario</mat-label>
        <input matInput formControlName="username" required>
        <mat-icon matPrefix class="input-icon">person_outline</mat-icon>
        <mat-hint>Ej: admin</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="fill" floatLabel="always" class="form-field">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" required>
        <mat-icon matPrefix class="input-icon">lock_outline</mat-icon>
        <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <div *ngIf="errorMessage" class="error-message animate__animated animate__shakeX">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button 
        mat-raised-button 
        color="primary" 
        type="submit" 
        class="submit-button"
        [disabled]="loginForm.invalid || isLoading"
        [class.loading]="isLoading"
      >
        <span *ngIf="!isLoading">Ingresar</span>
        <mat-spinner *ngIf="isLoading" diameter="24"></mat-spinner>
      </button>
    </form>

    
  </mat-card>
</div>
